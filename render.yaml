services:
  - type: web
    name: flightwiser-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      # OpenSky itself (OPENSKY_CLIENT_ID/SECRET, OPENSKY_RELAY_URL/SECRET) is
      # deliberately absent here: the deployed backend no longer calls it at
      # all (see README section Limitations) — it only reads flight_pool.jsonl,
      # bundled with the deploy, and Supabase. Those variables still matter
      # locally, for scripts/collect_opensky_pool.py (backend/.env).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
