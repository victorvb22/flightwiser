name: CI

# Runs on every push and pull request -- backend tests (pytest) and a
# frontend type-check/build, so a regression like the categorie/jet_affaire
# one (fixed 2026-09-21, see git history) gets caught automatically before
# it reaches Render/Vercel instead of relying on a manual audit to find it.
on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # tests/conftest.py sets SUPABASE_URL/SUPABASE_KEY itself (and blocks
      # all outbound network calls) -- no secrets needed here, the suite
      # never touches the real Supabase project.
      - run: pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
