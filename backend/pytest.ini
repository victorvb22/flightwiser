[pytest]
; Puts backend/ on sys.path, the same way every scripts/*.py entry point
; does by hand (sys.path.insert(0, str(BACKEND_DIR))) -- so tests import
; "pipeline", "services.xxx", "models.xxx" exactly like the app itself does,
; with no test-only import shims to keep in sync with the real code.
pythonpath = .
testpaths = tests
